[project]
name = "naver-mcp"
version = "0.1.0"
description = "네이버 검색 API(블로그·지역·웹문서·카페)를 Claude에 연결하는 MCP 서버"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2,<3", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
naver-mcp = "naver_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["naver_mcp"]
